
name: Update GitHub Profile Statistics

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/github-stats.yml"

permissions:
  contents: write

concurrency:
  group: github-profile-statistics
  cancel-in-progress: false

jobs:
  update-statistics:
    name: Generate Statistics Cards
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Profile Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Generate GitHub Statistics Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=SailokeshNalabothu&show_icons=true&hide_border=true&theme=tokyonight&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=SailokeshNalabothu&layout=compact&langs_count=8&hide_border=true&theme=tokyonight
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Generated Cards
        shell: bash
        run: |
          set -euo pipefail
          test -s profile/stats.svg
          test -s profile/top-langs.svg
          echo "Both statistics cards were generated."

      - name: Commit Updated Statistics
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "Statistics have not changed."
            exit 0
          fi

          git commit -m "chore: update GitHub profile statistics"
          git push origin HEAD:main
