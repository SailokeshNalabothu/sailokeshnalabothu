<svg xmlns="http://www.w3.org/2000/svg" width="210" height="60" viewBox="0 0 210 60" role="img" aria-label="LeetCode" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <clipPath id="c"><rect x="1" y="1" width="208" height="58" rx="14"/></clipPath>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <style>
      text { font-family: 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; }
      @keyframes pulse { 0%, 100% { stroke-opacity: 0.35; } 50% { stroke-opacity: 1; } }
      @keyframes sweep { 0% { transform: translateX(-90px) skewX(-20deg); } 55%, 100% { transform: translateX(300px) skewX(-20deg); } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
      @keyframes halo  { 0%, 100% { opacity: 0.14; } 50% { opacity: 0.32; } }
      .ring  { animation: pulse 3.2s ease-in-out 1.8s infinite backwards; }
      .sheen { animation: sweep 4.5s ease-in-out 1.8s infinite backwards; }
      .icon  { animation: float 3.2s ease-in-out 1.8s infinite backwards; }
      .halo  { animation: halo 3.2s ease-in-out 1.8s infinite backwards; }
      @media (prefers-reduced-motion: reduce) { .ring, .sheen, .icon, .halo { animation: none; } .sheen { display: none; } }
    </style>
  </defs>
  <rect x="1" y="1" width="208" height="58" rx="14" fill="#0D1117"/>
