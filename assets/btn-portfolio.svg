<svg xmlns="http://www.w3.org/2000/svg" width="210" height="60" viewBox="0 0 210 60" role="img" aria-label="Portfolio" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <clipPath id="c"><rect x="1" y="1" width="208" height="58" rx="14"/></clipPath>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <style>
      text { font-family: 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; }
      @keyframes pulse { 0%, 100% { stroke-opacity: 0.35; } 50% { stroke-opacity: 1; } }
      @keyframes sweep { 0% { transform: translateX(-90px) skewX(-20deg); } 55%, 100% { transform: translateX(300px) skewX(-20deg); } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
      @keyframes halo  { 0%, 100% { opacity: 0.14; } 50% { opacity: 0.32; } }
      .ring  { animation: pulse 3.2s ease-in-out 1.2s infinite backwards; }
      .sheen { animation: sweep 4.5s ease-in-out 1.2s infinite backwards; }
      .icon  { animation: float 3.2s ease-in-out 1.2s infinite backwards; }
      .halo  { animation: halo 3.2s ease-in-out 1.2s infinite backwards; }
      @media (prefers-reduced-motion: reduce) { .ring, .sheen, .icon, .halo { animation: none; } .sheen { display: none; } }
    </style>
  </defs>
  <rect x="1" y="1" width="208" height="58" rx="14" fill="#0D1117"/>
  <rect x="1" y="1" width="208" height="58" rx="14" fill="#22D3EE" opacity="0.07"/>
  <g clip-path="url(#c)"><rect class="sheen" x="0" y="-4" width="60" height="68" fill="url(#sheen)"/></g>
  <rect class="ring" x="1" y="1" width="208" height="58" rx="14" fill="none" stroke="#22D3EE" stroke-width="2"/>
  <circle class="halo" cx="35" cy="30" r="20" fill="#22D3EE" opacity="0.2"/>
  <g transform="translate(23 18)"><g class="icon"><g fill="none" stroke="#22D3EE" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><ellipse cx="12" cy="12" rx="4.2" ry="9.5"/><path d="M2.5 12h19M4.2 7h15.6M4.2 17h15.6"/></g></g></g>
  <text x="68" y="29" font-size="17" font-weight="700" fill="#FFFFFF">Portfolio</text>
  <text x="68" y="46" font-size="12" fill="#8B949E">view my work</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
