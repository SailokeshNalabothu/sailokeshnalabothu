<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="Let's build something together. Open to internships and entry-level roles." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="55%" stop-color="#1D3A8A"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" opacity="0.14"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="36"/></filter>
    <clipPath id="round"><rect width="1000" height="230" rx="18"/></clipPath>
    <style>
      text { font-family: 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes grow { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
      @keyframes cycle {
        0% { opacity: 0; transform: translateY(8px); } 4% { opacity: 1; transform: translateY(0); }
        30% { opacity: 1; transform: translateY(0); } 34% { opacity: 0; transform: translateY(-6px); } 100% { opacity: 0; }
      }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      .pill  { animation: rise 0.9s ease-out both; }
      .head  { animation: rise 1s ease-out 0.25s both; }
      .line  { transform-box: fill-box; transform-origin: left center; animation: grow 1s ease-out 0.7s both; }
      .tag   { opacity: 0; animation: cycle 12s ease-in-out infinite backwards; }
      .t2 { animation-delay: 4s; } .t3 { animation-delay: 8s; }
      .mail  { animation: bob 3.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .pill, .head, .line, .tag, .mail { animation: none; } .tag { opacity: 0; } .t1 { opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="230" fill="url(#bg)"/>
    <rect width="1000" height="230" fill="url(#dots)"/>

    <circle cx="180" cy="60" r="100" fill="#38BDF8" opacity="0.26" filter="url(#blur)">
      <animate attributeName="cx" values="180;320;180" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="120" r="120" fill="#06B6D4" opacity="0.30" filter="url(#blur)">
      <animate attributeName="cy" values="120;80;120" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- signal rings around the envelope -->
    <g transform="translate(850 108)" fill="none" stroke="#7DD3FC">
      <circle r="28" stroke-width="2" opacity="0">
        <animate attributeName="r" values="28;96" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.65;0" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle r="28" stroke-width="2" opacity="0">
        <animate attributeName="r" values="28;96" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.65;0" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="28" stroke-width="2" opacity="0">
        <animate attributeName="r" values="28;96" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.65;0" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle r="34" fill="#0B1020" fill-opacity="0.55" stroke-width="1.5" stroke-opacity="0.5"/>
      <g class="mail" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="-16" y="-11" width="32" height="22" rx="4"/>
        <path d="M-15 -8 L0 3 L15 -8"/>
      </g>
    </g>

    <!-- availability pill -->
    <g class="pill">
      <rect x="60" y="26" width="418" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.22"/>
      <circle cx="84" cy="43" r="5" fill="#4ADE80"/>
      <circle cx="84" cy="43" r="5" fill="none" stroke="#4ADE80" stroke-width="2">
        <animate attributeName="r" values="5;15" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="102" y="48" font-size="13" font-weight="600" letter-spacing="1.4" fill="#BBF7D0">OPEN TO INTERNSHIPS &amp; ENTRY-LEVEL ROLES</text>
    </g>

    <text class="head" x="60" y="112" font-size="46" font-weight="800" fill="url(#title)">Let&#8217;s build something together.</text>
    <rect class="line" x="60" y="126" width="190" height="3" rx="1.5" fill="#38BDF8"/>

    <g class="mono" font-size="17" fill="#E0F2FE">
      <text class="tag t1" x="60" y="162">&gt; backend engineering &amp; REST API design</text>
      <text class="tag t2" x="60" y="162">&gt; application security &amp; authentication</text>
      <text class="tag t3" x="60" y="162">&gt; AI projects, RAG &amp; real-world products</text>
    </g>

    <path fill="#38BDF8" opacity="0.20" d="M0 200 Q125 170 250 200 T500 200 T750 200 T1000 200 T1250 200 T1500 200 T1750 200 T2000 200 V230 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path fill="#0B1020" opacity="0.55" d="M-500 212 Q-375 188 -250 212 T0 212 T250 212 T500 212 T750 212 T1000 212 T1250 212 T1500 212 V230 H-500 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="500 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
