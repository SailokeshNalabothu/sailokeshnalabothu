<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Sai Lokesh Nalabothu, Full-Stack Developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="55%" stop-color="#1D3A8A"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" opacity="0.14"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <clipPath id="round"><rect width="1000" height="280" rx="18"/></clipPath>
    <style>
      text { font-family: 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

      @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes grow { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
      @keyframes cycle {
        0%   { opacity: 0; transform: translateY(8px); }
        4%   { opacity: 1; transform: translateY(0); }
        30%  { opacity: 1; transform: translateY(0); }
        34%  { opacity: 0; transform: translateY(-6px); }
        100% { opacity: 0; }
      }
      @keyframes shimmer { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; } }

      .name  { animation: rise 1.1s ease-out both, shimmer 5s ease-in-out 1.2s infinite; }
      .line  { transform-box: fill-box; transform-origin: center; animation: grow 1s ease-out 0.5s both; }
      .sub   { animation: rise 1s ease-out 0.7s both; }
      .tag   { opacity: 0; animation: cycle 12s ease-in-out infinite backwards; }
      .t2    { animation-delay: 4s; }
      .t3    { animation-delay: 8s; }

      @media (prefers-reduced-motion: reduce) {
        .name, .line, .sub, .tag { animation: none; }
        .tag { opacity: 0; }
        .t1 { opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#dots)"/>

    <!-- glowing orbs -->
    <circle cx="140" cy="70" r="110" fill="#38BDF8" opacity="0.28" filter="url(#blur)">
      <animate attributeName="cx" values="140;300;140" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;120;70" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="210" r="130" fill="#06B6D4" opacity="0.30" filter="url(#blur)">
      <animate attributeName="cx" values="860;700;860" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="210;140;210" dur="13s" repeatCount="indefinite"/>
    </circle>

    <!-- rising particles -->
    <g fill="#FFFFFF">
      <circle cx="80"  cy="270" r="2.5" opacity="0.55"><animate attributeName="cy" values="290;-10" dur="9s"  begin="-2s" repeatCount="indefinite"/></circle>
      <circle cx="190" cy="270" r="3"   opacity="0.40"><animate attributeName="cy" values="290;-10" dur="12s" begin="-7s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="270" r="2"   opacity="0.55"><animate attributeName="cy" values="290;-10" dur="8s"  begin="-4s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="270" r="3.5" opacity="0.30"><animate attributeName="cy" values="290;-10" dur="14s" begin="-9s" repeatCount="indefinite"/></circle>
      <circle cx="620" cy="270" r="2.5" opacity="0.50"><animate attributeName="cy" values="290;-10" dur="10s" begin="-1s" repeatCount="indefinite"/></circle>
      <circle cx="740" cy="270" r="2"   opacity="0.55"><animate attributeName="cy" values="290;-10" dur="7s"  begin="-5s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="270" r="3"   opacity="0.40"><animate attributeName="cy" values="290;-10" dur="11s" begin="-3s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="270" r="2"   opacity="0.55"><animate attributeName="cy" values="290;-10" dur="9s"  begin="-6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- title block -->
    <text class="name" x="500" y="118" text-anchor="middle" font-size="54" font-weight="800" fill="url(#title)">Sai Lokesh Nalabothu</text>
    <rect class="line" x="420" y="134" width="160" height="3" rx="1.5" fill="#38BDF8"/>
    <text class="sub" x="500" y="170" text-anchor="middle" font-size="17" letter-spacing="4" fill="#BAE6FD">FULL-STACK DEVELOPER · BACKEND · CYBERSECURITY</text>

    <!-- cycling taglines -->
    <g class="mono" font-size="17" fill="#E0F2FE" text-anchor="middle">
      <text class="tag t1" x="500" y="206">&gt; building secure &amp; scalable applications</text>
      <text class="tag t2" x="500" y="206">&gt; exploring AI, RAG &amp; LLM engineering</text>
      <text class="tag t3" x="500" y="206">&gt; turning ideas into real-world products</text>
    </g>

    <!-- waves -->
    <path fill="#38BDF8" opacity="0.20" d="M0 240 Q125 205 250 240 T500 240 T750 240 T1000 240 T1250 240 T1500 240 T1750 240 T2000 240 V280 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path fill="#0B1020" opacity="0.55" d="M-500 252 Q-375 225 -250 252 T0 252 T250 252 T500 252 T750 252 T1000 252 T1250 252 T1500 252 V280 H-500 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="500 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
