<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" role="img" aria-label="Terminal card: Sai Lokesh Nalabothu, focus areas and current status" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <style>
      text { font-family: 'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 16px; }
      .p  { fill: #38BDF8; }
      .c  { fill: #E6EDF3; }
      .o1 { fill: #7DD3FC; }
      .o2 { fill: #A5B4FC; }
      .ok { fill: #4ADE80; }
      .dim{ fill: #8B949E; }

      .l { opacity: 0; }
      @keyframes l1 { 0%{opacity:0;transform:translateX(-8px)} 3%{opacity:0;transform:translateX(-8px)} 5%{opacity:1;transform:translateX(0)} 92%{opacity:1} 96%{opacity:0} 100%{opacity:0} }
      @keyframes l2 { 0%{opacity:0;transform:translateX(-8px)} 8%{opacity:0;transform:translateX(-8px)} 10%{opacity:1;transform:translateX(0)} 92%{opacity:1} 96%{opacity:0} 100%{opacity:0} }
      @keyframes l3 { 0%{opacity:0;transform:translateX(-8px)} 15%{opacity:0;transform:translateX(-8px)} 17%{opacity:1;transform:translateX(0)} 92%{opacity:1} 96%{opacity:0} 100%{opacity:0} }
      @keyframes l4 { 0%{opacity:0;transform:translateX(-8px)} 20%{opacity:0;transform:translateX(-8px)} 22%{opacity:1;transform:translateX(0)} 92%{opacity:1} 96%{opacity:0} 100%{opacity:0} }
      @keyframes l5 { 0%{opacity:0;transform:translateX(-8px)} 27%{opacity:0;transform:translateX(-8px)} 29%{opacity:1;transform:translateX(0)} 92%{opacity:1} 96%{opacity:0} 100%{opacity:0} }
      @keyframes l6 { 0%{opacity:0;transform:translateX(-8px)} 32%{opacity:0;transform:translateX(-8px)} 34%{opacity:1;transform:translateX(0)} 92%{opacity:1} 96%{opacity:0} 100%{opacity:0} }
      @keyframes l7 { 0%{opacity:0;transform:translateX(-8px)} 38%{opacity:0;transform:translateX(-8px)} 40%{opacity:1;transform:translateX(0)} 92%{opacity:1} 96%{opacity:0} 100%{opacity:0} }
      @keyframes l8 { 0%{opacity:0} 44%{opacity:0} 46%{opacity:1} 92%{opacity:1} 96%{opacity:0} 100%{opacity:0} }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

      .a1 { animation: l1 16s ease-out infinite; }
      .a2 { animation: l2 16s ease-out infinite; }
      .a3 { animation: l3 16s ease-out infinite; }
      .a4 { animation: l4 16s ease-out infinite; }
      .a5 { animation: l5 16s ease-out infinite; }
      .a6 { animation: l6 16s ease-out infinite; }
      .a7 { animation: l7 16s ease-out infinite; }
      .a8 { animation: l8 16s ease-out infinite; }
      .cursor { animation: blink 1s steps(1) infinite; }

      @media (prefers-reduced-motion: reduce) {
        .l { animation: none; opacity: 1; }
        .cursor { animation: none; }
      }
    </style>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="898" height="308" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  <path d="M1 15 a14 14 0 0 1 14 -14 h870 a14 14 0 0 1 14 14 v27 h-898 z" fill="url(#bar)"/>
  <circle cx="28" cy="22" r="6.5" fill="#FF5F57"/>
  <circle cx="50" cy="22" r="6.5" fill="#FEBC2E"/>
  <circle cx="72" cy="22" r="6.5" fill="#28C840"/>
  <text x="450" y="27" text-anchor="middle" class="dim" style="font-size:13px">sailokesh@dev: ~</text>

  <!-- lines -->
  <g>
    <text class="l a1" x="36" y="84"><tspan class="p">$</tspan> <tspan class="c">whoami</tspan></text>
    <text class="l a2" x="36" y="110" ><tspan class="o1">sai lokesh nalabothu — cse (cyber security)</tspan></text>

    <text class="l a3" x="36" y="146"><tspan class="p">$</tspan> <tspan class="c">cat focus.txt</tspan></text>
    <text class="l a4" x="36" y="172"><tspan class="o2">full-stack · backend · application security · ai</tspan></text>

    <text class="l a5" x="36" y="208"><tspan class="p">$</tspan> <tspan class="c">cat status.txt</tspan></text>
    <text class="l a6" x="36" y="234"><tspan class="o1">building devprep-ai | learning rag + system design</tspan></text>
    <text class="l a7" x="36" y="260"><tspan class="ok">open to internships &amp; entry-level roles</tspan></text>

    <g class="l a8">
      <text x="36" y="292"><tspan class="p">$</tspan></text>
      <rect class="cursor" x="56" y="278" width="10" height="17" fill="#38BDF8"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
